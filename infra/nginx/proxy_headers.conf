# Shared by every proxied location.
proxy_http_version 1.1;
proxy_set_header Host $http_host;

# The visitor's address, as nginx saw it on the connection. Always OVERWRITTEN here, never
# appended to, so whatever a browser sent in these headers is gone before the request reaches
# the API. The API reads X-Real-IP and never X-Forwarded-For.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# These two carry the signed address that only the Next.js server may attach on its own
# server-side calls. A browser must never be able to supply them.
proxy_set_header X-Client-IP "";
proxy_set_header X-Client-IP-Signature "";

# WebSocket upgrade (Socket.IO).
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 3s;
# If one API instance is gone (being recreated), try the other one.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
