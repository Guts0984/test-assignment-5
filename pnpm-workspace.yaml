packages:
  - apps/*
  - packages/*

# Install scripts are denied unless a dependency genuinely needs them.
# esbuild ships its binary as a prebuilt platform package; cpu-features and ssh2 are optional
# native add-ons of testcontainers (pure-JS fallback); protobufjs only runs a version check.
allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
