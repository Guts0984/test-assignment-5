name: CI

# Runs on every push to any branch and on every pull request. Runs are never cancelled or
# deleted by this workflow, so the history of every commit stays visible.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install -g pnpm@12.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Integration tests start real PostgreSQL containers (Testcontainers); Docker is
      # available on the runner.
      - name: Test
        run: pnpm test

  compose:
    name: Docker Compose (build and database init)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The only manual step of the real setup.
      - name: Create .env
        run: cp .env.example .env

      - name: Build images, start PostgreSQL, run init (migrate + seed)
        run: docker compose run --rm --build init

      - name: Check the seeded data
        run: |
          counts=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -c "select (select count(*) from users) || chr(32) || (select count(*) from workspaces) || chr(32) || (select count(*) from boards) || chr(32) || (select count(*) from board_columns) || chr(32) || (select count(*) from cards)"')
          echo "users workspaces boards columns cards: $counts"
          test "$counts" = "4 2 3 15 1022"

      - name: Run init again, it must not duplicate anything
        run: |
          docker compose run --rm init | tee init-second-run.log
          grep -q "seed skipped" init-second-run.log
          counts=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -c "select count(*) from users"')
          test "$counts" = "4"

      - name: Start the whole stack
        run: docker compose up --build -d --wait

      - name: Both API instances are ready
        run: |
          for api in api1 api2; do
            docker compose exec -T "$api" wget -qO- http://127.0.0.1:3001/ready
            echo
          done

      # Everything below goes through nginx on the public address, as a browser would.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install the smoke test
        run: |
          npm install -g pnpm@12.6.0
          pnpm install --frozen-lockfile --filter @kanban/e2e...

      - name: Smoke test through nginx (upload, download, WebSocket, limits with forged headers)
        run: pnpm --filter @kanban/e2e smoke

      # Acceptance check 16: recreating the API containers (new IP addresses) must not need an
      # nginx restart. The old addresses are occupied first, so the new containers really move.
      - name: Recreate the API containers under a running nginx
        run: |
          nginx_id=$(docker compose ps -q nginx)
          started=$(docker inspect -f '{{.State.StartedAt}}' "$nginx_id")
          ip_of() { docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q "$1")"; }
          old1=$(ip_of api1); old2=$(ip_of api2)
          network=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$nginx_id")
          docker compose rm -sf api1 api2
          for n in 1 2; do docker run -d --rm --network "$network" --name "squat$n" alpine sleep 300 >/dev/null; done
          docker compose up -d --no-deps api1 api2
          echo "api1: $old1 -> $(ip_of api1), api2: $old2 -> $(ip_of api2)"
          test "$old1" != "$(ip_of api1)"
          ok=0
          for _ in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/ready)" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          docker rm -f squat1 squat2 >/dev/null 2>&1 || true
          test "$ok" = "1"
          test "$started" = "$(docker inspect -f '{{.State.StartedAt}}' "$nginx_id")"

      # Socket.IO must be present in the built image and WebSocket-only (no long-polling fallback).
      - name: Socket.IO is served by the built image
        run: |
          docker compose exec -T api1 node -e "fetch('http://127.0.0.1:3001/socket.io/?EIO=4&transport=polling').then(async (r) => { const t = await r.text(); console.log(r.status, t); process.exit(r.status === 400 && t.includes('Transport unknown') ? 0 : 1); })"

      # Acceptance check 15: restarting PostgreSQL, then Redis, must not take the API down.
      - name: Restart PostgreSQL and Redis under the running APIs
        run: |
          wait_ready() {
            for _ in $(seq 1 45); do
              if docker compose exec -T "$1" wget -qO /dev/null http://127.0.0.1:3001/ready 2>/dev/null; then return 0; fi
              sleep 1
            done
            echo "$1 did not become ready again"; return 1
          }
          docker compose restart postgres
          wait_ready api1
          wait_ready api2
          docker compose restart redis
          wait_ready api1
          wait_ready api2
          for api in api1 api2; do
            restarts=$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q "$api")")
            echo "$api restarts: $restarts"
            test "$restarts" = "0"
          done

      # Acceptance check 15: SIGTERM ends the process cleanly with exit code 0.
      - name: SIGTERM stops the API and the worker with exit code 0
        run: |
          docker compose kill -s SIGTERM api1 worker
          sleep 5
          for service in api1 worker; do
            code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -a -q "$service")")
            echo "$service exit code: $code"
            test "$code" = "0"
          done

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
