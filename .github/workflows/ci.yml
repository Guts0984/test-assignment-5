name: CI

# Runs on every push to any branch and on every pull request. Runs are never cancelled or
# deleted by this workflow, so the history of every commit stays visible.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install -g pnpm@12.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Integration tests start real PostgreSQL containers (Testcontainers); Docker is
      # available on the runner.
      - name: Test
        run: pnpm test

  compose:
    name: Docker Compose (build and database init)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The only manual step of the real setup.
      - name: Create .env
        run: cp .env.example .env

      - name: Build images, start PostgreSQL, run init (migrate + seed)
        run: docker compose run --rm --build init

      - name: Check the seeded data
        run: |
          counts=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -c "select (select count(*) from users) || chr(32) || (select count(*) from workspaces) || chr(32) || (select count(*) from boards) || chr(32) || (select count(*) from board_columns) || chr(32) || (select count(*) from cards)"')
          echo "users workspaces boards columns cards: $counts"
          test "$counts" = "4 2 3 15 1022"

      - name: Run init again, it must not duplicate anything
        run: |
          docker compose run --rm init | tee init-second-run.log
          grep -q "seed skipped" init-second-run.log
          counts=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -c "select count(*) from users"')
          test "$counts" = "4"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
